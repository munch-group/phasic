
# [build-system]
# requires = ["setuptools >= 77.0.3", "pybind11>=2.10.0", "eigen"]
# build-backend = "setuptools.build_meta"
[build-system]
requires = ["setuptools", "wheel", "scikit-build-core", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.verbose = true
cmake.minimum-version = "3.30"
wheel.packages = ["src/phasic"]

[project]
name = "phasic"
version = "0.22.22"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Topic :: Software Development :: Build Tools",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">= 3.9"
dependencies = [
  'pybind11>=2.10.0',
  'jax',
  'numpy',
  'eigen',
  "ipython",
  "ipykernel",
  "ipywidgets",
  "json5",
  "requests",
  'graphviz',
  'nlohmann_json',
  'seaborn',
  'pyyaml',
  'psutil',
  'rich',
  'tqdm',
  'multiprocess>=0.70.0',  # For parallel trace computation (uses dill)
]
authors = [
  # {name = "Tobias Røikjer", email = ""},
  {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"},
]
maintainers = [
  {name = "Kasper Munch", email = "kaspermunch@birc.au.dk"},
]
description = ""
keywords = ["",]
readme = "README.md"
license = {file = "LICENSE.txt"}

[project.optional-dependencies]
jax = [
  'jax>=0.4.0',
#  'jaxlib',
]
ipfs = [
    'ipfshttpclient>=0.8.0',
    'requests>=2.25.0',
]
optax = [
    'optax>=0.2.0',
]
dev = [
    "pytest",
    "tszip>=0.2.5",
]
# docs = [
#     "sphinx",
#     "sphinx-rtd-theme",
# ]

[project.urls]
Homepage = "https://munch-group.org/phasic"
Documentation = "https://munch-group.org/phasic"
Repository = "https://github.com/munch-group/phasic.git"
Issues = "https://github.com/munch-group/phasic/issues"

[tool.pytest.ini_options]
testpaths = ["tests/pytest"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["phasic*"]  # package names should match these glob patterns (["*"] by default)
# exclude = ["my_package.tests*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


#pip install -e . --no-deps --force-reinstall



[tool.pixi.workspace]
channels = ["conda-forge", "munch-group"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.9,<3.14"
git = ">=2.51.0,<3"
gh = ">=2.81.0,<3"
quartodoc = ">=0.11.1,<0.12"
pip = "*"
cmake = ">=4.1.2,<5"
eigen = ">=3.4.0,<4"
nlohmann_json = ">=3.11.0"
ipykernel = ">=7.1.0,<8"
graphviz = ">=13.1.2,<14"
nbformat = ">=5.10.4,<6"
nbclient = ">=0.10.2,<0.11"
setuptools = ">=80.9.0,<81"
wheel = ">=0.45.1,<0.46"
scikit-build-core = ">=0.11.6,<0.12"
pybind11 = ">=2.10.0"
jax = ">=0.7.2,<0.8"
equinox = ">=0.13.2,<0.14"
ipfshttpclient = ">=0.8.0a2,<0.9"
py-spy = ">=0.4.1,<0.5"
gitui = ">=0.27.0,<0.28"
jupyter = ">=1.1.1,<2"
notebook = ">=7.4.7,<8"
nodejs = ">=24.4.1,<24.10"
electron = ">=1.6.15,<2"
nbstripout = ">=0.8.1,<0.9"
pytest = ">=9.0.1,<10"
json5 = ">=0.12.1,<0.13"
geopandas = ">=1.1.1,<2"
geodatasets = ">=2024.8.0,<2025"
vscodenb = ">=0.1.32,<0.2"
nbdime = ">=4.0.2,<5"
griffe = ">=1.15.0,<2"
mpfr = ">=4.2.1,<5"
gmp = "*"
pkg-config = "*"
optax = ">=0.2.6,<0.3"
h5py = ">=3.15.1,<4"

# [tool.pixi.pypi-dependencies]


[tool.pixi.environments]
default = {solve-group = "default"}

[tool.pixi.tasks.init]
cmd = "python ./scripts/rename.py && gh repo set-default https://github.com/munch-group/{{new_name}}"

[tool.pixi.tasks.install-dev]
cmd = "XLA_FFI_INCLUDE_DIR=$(python -c 'from jax import ffi; print(ffi.include_dir())') pip install --no-build-isolation --force-reinstall --no-deps ."
description = "Install phasic in development mode with FFI support"

[tool.pixi.tasks.notebook]
args = [ { "arg" = "notebook" } ]
cmd = "jupyter nbconvert --log-level=WARN --to notebook --execute --inplace --TagRemovePreprocessor.enabled=True --TagRemovePreprocessor.remove_cell_tags='{skip-execution}' {{ notebook }}"

[tool.pixi.tasks.api]
cmd = "./scripts/docs-build-render.sh"
description = "Build quartodoc api doc pages"

[tool.pixi.tasks.docs]
cmd = "./scripts/docs-run-notebooks.sh"
description = "Execute documentation notebooks in-place"

# [tool.pixi.tasks.docs]
# depends-on = ["notebook-docs", "api-docs"]
# cmd = "git add -u docs"
# description = "Run documentation notebooks build api docs and stage ./docs"

[tool.pixi.tasks.clean]
cmd = "git clean -id"
description = "Removes untracked files and directories but respects your .gitignores"

[tool.pixi.tasks.test]
cmd = "jupyter nbconvert docs/pages/tutorial/*.ipynb --to script --output-dir tests/pytest && pytest tests/pytest/"
description = "Run tests"

[tool.pixi.tasks.commit]
cmd = "./scripts/git-commit.sh"

[tool.pixi.tasks.bump]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump'

[tool.pixi.tasks.release]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump' && git push && ./scripts/github-release.sh && echo 'Update released!'"
description = "Bump version patch and push tag to build/upload conda/pypi packages"
  
[tool.pixi.tasks.version]
args = [
  { "arg" = "kind", "default" = "patch" },  # can be patch, minor, major
  { "arg" = "flag", "default" = "" },     # can be --pre, --release
]
cmd = "./scripts/bump_version.py --{{ kind }} {{ flag }} && git add pyproject.toml && git commit -m '{{ kind }} {{ flag }} version bump' && git push && ./scripts/github-release.sh && echo 'Update released!'"
depends-on = ["test", "api", "docs", "commit"]
description = "Bump version patch and push tag to build/upload conda/pypi packages"

