website:
  # title: "phasic"
  title: ""
  page-navigation: true


  repo-url: https://github.com/munch-group/phasic/
  repo-subdir: docs        # if .qmd files live in a subdirectory
  repo-branch: main        # defaults to main
  repo-actions: [edit, issue, source]

  # announcement: 
  #   icon: exclamation-lg
  #   dismissable: true
  #   content: "**Alert** - this is some information that you should pay attention to"
  #   type: info
  #   position: above-navbar


  navbar:
    logo: PHASIC.png
    logo-alt: "Phasic"
    logo-href: "/index.html"

    left:
      - href: pages/getting_started.html
        text: Documentation
      - href: api/
        text: Python API reference
      - href: cpp_api/
        text: C / C++ API reference
      - href: mathref/index.html
        text: Mathematical Reference
      # - href: r_api/
      #   text: R API reference
    right:
      - icon: github
        href: https://github.com/munch-group/phasic/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      collapse-level: 3
      contents:
        - pages/getting_started.ipynb
        - section: "Modeling"
          contents:
            - pages/tutorial/introduction.ipynb
            - pages/tutorial/state-space.ipynb
            - pages/tutorial/state-space-utils.ipynb
            - pages/tutorial/visualize.ipynb
            - pages/tutorial/properties.ipynb
            - pages/tutorial/discrete.ipynb
            - pages/tutorial/parametrization.ipynb
            - pages/tutorial/laplace.ipynb
            # - pages/tutorial/finite-markov-chains.ipynb
            - pages/tutorial/joint-probability.ipynb
            - pages/tutorial/time-inhomogeneous.ipynb
            # - pages/tutorial/state-lumping.ipynb
            # - pages/topics/R/partitioning.ipynb
        - section: "Inference"
          contents:
            - pages/tutorial/method-of-moments.ipynb
            - pages/tutorial/svgd-basics.ipynb
            - pages/tutorial/svgd-priors-and-schedules.ipynb
            - pages/tutorial/svgd-multi-feature.ipynb
            - pages/tutorial/svgd-multi-param.ipynb
            - pages/tutorial/svgd-joint-prob.ipynb
            - pages/tutorial/model-selection.ipynb
        - section: "Computation"
          contents:
            - pages/tutorial/configuration.ipynb
            - pages/tutorial/trace-and-jax-caching-c-path.ipynb
            - pages/tutorial/mpfr.ipynb
            - pages/tutorial/scc-decomposition.ipynb
            - pages/tutorial/distributed.ipynb
            - pages/tutorial/model-hub.ipynb
        - section: "Misc"
          contents:
            - pages/topics/vscodenb.ipynb
            # - pages/topics/caching_guide.qmd
            # - pages/topics/state-indexer.ipynb
            - href: https://github.com/munch-group/phasic/issues
              text: Issue Tracker
        # - section: "Popgen experiments"
        #   collapse-level: 1
        #   contents:
        #     - pages/popgen/coalescent-selection.ipynb
        #     - pages/popgen/combining_pdf_and_moments.md
        #     - pages/popgen/simulate_data.ipynb
        #     - pages/popgen/tree-seqs.ipynb
        #     - pages/popgen/two-locus-arg.ipynb
        #     - pages/popgen/two-locus-island.ipynb
        #     - pages/popgen/arg-constraint/arg_constraint_example.ipynb
        #     - pages/popgen/arg-constraint/clade_constraint_example.ipynb
        #     - pages/popgen/arg-constraint/example.ipynb



lightbox: true

format:
  html:
    linkcolor: "#0D7D92"
    grid:
      sidebar-width: 330px
      body-width: 900px
      margin-width: 270px
      gutter-width: 1.5rem
    theme: [cosmo, custom.scss] 
    highlight-style: numpy.theme
    css:
      - api/_styles-quartodoc.css
    notebook-links: true
    callout-icon: false
    code-overflow: scroll
    # code-tools:
    #   source: repo
    fig-align: center    
    html-math-method: mathjax
    toc: true
    mermaid:
      theme: neutral 
    fig-format: svg      
