name: Build and upload pypi packages

on:
  push:
#   release:
#     types:
#       - 'released'
#   branches:
#     - 'main'      
    tags:
      - v[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+.rc[0-9]+

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install build
      run: python3 -m pip install build

    - name: Build source tarball
      run: python3 -m build --sdist

    - name: Store the source distribution
      uses: actions/upload-artifact@v4
      with:
        name: python-sdist
        path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-13
            macos_arch: x86_64
            macos_deployment_target: "13.0"
          - os: macos-14
            macos_arch: arm64
            macos_deployment_target: "14.0"
          - os: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    # Set up QEMU for ARM64 Linux builds
    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Build wheels
      uses: pypa/cibuildwheel@v2.22
      env:
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-*
        # Skip musllinux (not commonly needed) and 32-bit builds
        CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
        # Use manylinux_2_28 (AlmaLinux 8) instead of manylinux2014 (CentOS 7 EOL)
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
        # Install mpfr and gmp build dependencies
        CIBW_BEFORE_ALL_LINUX: yum install -y mpfr-devel gmp-devel pkgconf
        CIBW_BEFORE_ALL_MACOS: brew install mpfr gmp pkg-config
        # Build ARM64 wheels on Linux using QEMU
        CIBW_ARCHS_LINUX: x86_64 aarch64
        # macOS: each runner builds its native arch only
        CIBW_ARCHS_MACOS: ${{ matrix.macos_arch || 'auto' }}
        # Set macOS deployment target to match Homebrew libraries
        CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target || '14.0' }}
        # Windows: only x86_64 (most common)
        CIBW_ARCHS_WINDOWS: AMD64

    - name: Store the wheels
      uses: actions/upload-artifact@v4
      with:
        name: python-wheels-${{ matrix.os }}
        path: wheelhouse/*.whl
        
        
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs:
    - build-sdist
    - build-wheels
    runs-on: ubuntu-latest

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        pattern: python-*
        merge-multiple: true

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true      