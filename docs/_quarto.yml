profile:
  group: 
    - [default, slides]
  default: default
  



filters:
  - "interlinks"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/ 
    jax:
      url: https://docs.jax.dev/en/latest/
    optax:
      url: https://optax.readthedocs.io/en/latest/
    ipython:
      url: https://ipython.readthedocs.io/en/stable/
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt


quartodoc:
  title: "API Reference"  
  package: phasic
  # package: null
  # source_dir: ../src/cpp
  style: pkgdown
  dir: api
  dynamic: true  # use runtime import for compiled extensions
  parser: numpy  # use numpy docstring parser (more lenient)
  render_interlinks: true
  options:
    signature_name: full
    # include_inherited: false  # Avoid cyclic alias issues with C++ parent class
    # include_empty: false  # Skip items that can't be loaded
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Graph
      package: phasic
      desc: |
        The graph interface carrying the main UI.
      contents:
        - Graph
        # - SymbolicDAG
    - title: Graph Construction
      package: phasic
      desc: |
        The state indexing utility for mapping between between the
        integer vectors of states and the model properties they represent.
      contents:
        - StateIndexer
        - PropertySet
        - Property
        - PropertyDict
        - StateVector

    - title: Spatial Grids
      package: phasic
      desc: |
        Hexagonal grid utilities for spatial phase-type models on
        geographic boundaries.
      contents:
        - HexGrid
        - HexCell

    - title: Exceptions
      package: phasic.exceptions
      desc: |
        Custom exceptions for error handling in phasic.
      contents:
        - PTDAlgorithmsError
        - PTDConfigError
        - PTDBackendError
        - PTDFeatureError
        - PTDJAXError

    - title: Sparse observations
      package: phasic.svgd
      desc: |
        Sparse observations for multi-feature data.
      contents:
        - SparseObservations
        - dense_to_sparse
        - is_sparse_observations

    - title: Stein Variational Gradient Descent
      package: phasic.svgd
      desc: |
        Stein Variational Gradient Descent and preconditioners.
      contents:
        - MomentJacobianPreconditioner
        - FisherPreconditioner
        - SVGD
        - SVGDKernel

    - title: Priors
      package: phasic.svgd
      desc: |
        Prior distributions of model parameters.
      contents:
        - DataPrior
        - Prior
        - GaussPrior
        - HalfCauchyPrior

    - title: Learning rate and regularization
      package: phasic.svgd
      desc: |
        Learning rate schedules and regularization techniques for 
        Stein Variational Gradient Descent.
      contents:
        - StepSizeSchedule
        - ConstantStepSize
        - ExpStepSize
        - AdaptiveStepSize
        - WarmupExpStepSize
        - RegularizationSchedule
        - ConstantRegularization
        - ExpRegularization

    - title: Optimizers
      package: phasic.svgd
      desc: |
        Adaptive optimizers. Recommended only for models that 
        will not otherwise converge. 
      contents:
        - Adam
        - SGDMomentum
        - RMSprop
        - Adagrad

    - title: Optax optimizer support
      package: phasic.optax_wrapper
      desc: |
        Support for using optimizers from the external Optax library 
        some of them pre-wrapped for convenience. Recommended only for
        models that will not otherwise converge, and for users who 
        want to experiment with a wider range of optimizers.
      contents:
        - OptaxOptimizer
        - optax_adam
        - optax_adamw
        - optax_sgd
        - optax_rmsprop
        - optax_adagrad
        - optax_chain
        - optax_lion

    - title: Library utilities
      package: phasic
      desc: |
        Configuration and Logging.
      contents:
        - clear_caches
        - configure
        - get_config
        - get_available_options
        - PTDAlgorithmsConfig
        - reset_config
        - set_log_level
        - get_logger

