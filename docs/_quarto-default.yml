project:
  type: website
  output-dir: _build
  pre-render: 
    - quarto render mathref/
  post-render:
    - quarto render slides/
    - quarto render manuscript/ 

  # resources:
  # - objects.txt
  # - objects-test.txt

  # pre-render: generate-gallery.ts
  # # Hack to clean temporary file
  # # post-render:
  # #   - find galleries/ -name "gallery-styles.css" -delete

  render:
    - "**/*.qmd"  # render all qmd files
    - "**/*.ipynb"  # render all qmd files
    - "!mathref/"  # excluded as it is pre-render book
    - "!slides/index.qmd" # excluded as it is post-render risejs
    - "!pages/vignettes/" # just excluded
    - "!internals/" # just excluded
    - "!pages/benchmarks/**" # just excluded
    - "!pages/topics/R/" # just excluded

comments:
  hypothesis: true
  
execute:
  freeze: auto
  echo: true
  fig-format: svg  

metadata-files:
  - cpp_api/_sidebar.yml
  - api/_sidebar.yml

