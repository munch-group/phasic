project:
  type: book
  output-dir: ../_build/mathref

bibliography: references.bib

book:
  title: "Mathematical Reference "
  subtitle: "Mathematical and Algorithmic Documentation for Phasic"
  navbar:
    logo: ../PHASIC.png
    logo-alt: "Phasic"
    logo-href: /index.html
    left:
      - href: /pages/getting_started.html
        text: Documentation
      - href: /api/
        text: Python API reference
      - href: /mathref/index.html
        text: Mathematical Reference
    right:
      - icon: github
        href: https://github.com/munch-group/phasic/
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01_preliminaries.qmd
        - 02_graph_representation.qmd
        - 03_numerical_primitives.qmd
    - part: "Graph Algorithms"
      chapters:
        - 04_scc_and_topological_sort.qmd
        - 05_graph_normalization.qmd
        - 06_graph_elimination.qmd
        - 07_reward_transformation.qmd
        - 07b_fill_in_complexity.qmd
        - 08_state_space_construction.qmd
    - part: "Symbolic System and Traces"
      chapters:
        - 09_symbolic_expressions.qmd
        - 10_symbolic_graph_elimination.qmd
        - 11_trace_system.qmd
        - 12_graph_hashing.qmd
        - 13_scc_trace_stitching.qmd
    - part: "Distribution and Moments"
      chapters:
        - 14_distribution_computation.qmd
        - 15_moment_computation.qmd
        - 16_pdf_gradients.qmd
    - part: "Sampling"
      chapters:
        - 17_sampling.qmd
    - part: "Inference"
      chapters:
        - 18_svgd.qmd
        - 19_mcmc.qmd
        - 20_bffg.qmd
        - 21_method_of_moments.qmd
        - 22_probability_matching.qmd
    - part: "Spatial and State Indexing"
      chapters:
        - 23_state_indexing.qmd
        - 24_hex_grid.qmd
    - part: "Integration"
      chapters:
        - 25_jax_integration.qmd
        - 26_graph_builder.qmd
        - 27_van_loan_equivalence.qmd
    - 28_references.qmd

crossref:
  thm-prefix: "Theorem"
  def-prefix: "Definition"
  lem-prefix: "Lemma"
  cor-prefix: "Corollary"
  prp-prefix: "Proposition"
  eq-prefix: "Equation"
  custom:
    - kind: float
      key: alg
      reference-prefix: "Algorithm"
  chapters: true

format:
  html:
    linkcolor: "#0D7D92"
    grid:
      sidebar-width: 330px
      body-width: 900px
      margin-width: 270px
      gutter-width: 1.5rem
    theme: [cosmo, ../custom.scss]
    highlight-style: ../numpy.theme
    toc: true
    number-sections: true
    callout-icon: false
    code-overflow: scroll
    fig-align: center
    html-math-method: katex
    mermaid:
      theme: neutral
