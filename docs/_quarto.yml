project:
  type: website
  output-dir: _build
  # resources:
  # - objects.txt
  # - objects-test.txt

  # pre-render: generate-gallery.ts
  # # Hack to clean temporary file
  # # post-render:
  # #   - find galleries/ -name "gallery-styles.css" -delete

  render:
    - "**/*.qmd"  # render all qmd files
    - "**/*.ipynb"  # render all qmd files
    # - "!draft-*.qmd"  # except those starting with draft-
    - "!internal/"  # exclude entire directories
    - "!pages/benchmarks/**"
    - "!pages/popgen/"
    - "!pages/topics/R/"


execute:
  freeze: auto
  echo: true

metadata-files:
  - api/_sidebar.yml

filters:
  - "interlinks"

interlinks:
  fast: true
  sources:
    python:
      url: https://docs.python.org/3/
    griffe:
      url: https://mkdocstrings.github.io/griffe/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/docs/
    matplotlib:
      url: https://matplotlib.org/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    statsmodels:
      url: https://www.statsmodels.org/stable/ 
    jax:
      url: https://docs.jax.dev/en/latest/     
    # quartodoc-test:
    #   url: https://machow.github.io/quartodoc
    #   inv: objects-test.txt

website:
  # title: "phasic"
  title: ""
  page-navigation: true

  # announcement: 
  #   icon: exclamation-lg
  #   dismissable: true
  #   content: "**Alert** - this is some information that you should pay attention to"
  #   type: info
  #   position: above-navbar


  navbar:
    logo: PHASIC.png
    logo-alt: "Phasic"  # For accessibility
    logo-href: "/index.html"  # Where clicking the logo goes

    left:
      - href: pages/quickstart.html
        text: Documentation
      - href: api/
        text: Python API reference
      # - href: r_api/
      #   text: R API reference
      # - href: c_api/
      #   text: C API reference
    right:
      - icon: github
        href: https://github.com/munch-group/phasic/
  sidebar:
    - id: pages
      title: Get Started
      style: floating
      align: left
      contents:
        - pages/quickstart.ipynb
        - section: "Tutorial"
          contents:
            - pages/tutorial/00-introduction.ipynb
            - pages/tutorial/01-state-space.ipynb
            - pages/tutorial/02-properties.ipynb
            - pages/tutorial/03-discrete.ipynb
            - pages/tutorial/04-state-space-utils.ipynb
            - pages/tutorial/05-parametrization.ipynb
            - pages/tutorial/06-time-inhomogeneous.ipynb
            - pages/tutorial/07-trace_computing.ipynb
            - pages/tutorial/08-laplace.ipynb
            - pages/tutorial/09-joint-probability.ipynb
            - pages/tutorial/10-finite-markov-chains.ipynb
            - pages/tutorial/11-method-of-moments.ipynb
            - pages/tutorial/11-svgd-basics.ipynb
            - pages/tutorial/12-svgd-multi-feature.ipynb
            - pages/tutorial/13-svgd-multi-param.ipynb
            - pages/tutorial/14-svgd-joint-prob.ipynb
            - pages/tutorial/15-distributed.ipynb
            - pages/tutorial/16-caching.ipynb
            - pages/tutorial/17-sharing.ipynb
        - section: "Topics"
          contents:
            - pages/topics/visualize.ipynb
            - pages/topics/vscodenb.ipynb
            - pages/topics/priors-and-schedules.ipynb
            - pages/topics/caching_guide.qmd
            - pages/topics/state-indexer.ipynb
            # - pages/tutorials/somecode.ipynb
        - section: "Popgen models"
          contents:
            - pages/popgen/python/demography/coalescent-epochs.ipynb
        - section: "Internals"
          contents:
            - pages/background/math_and_alg.qmd

            - pages/internals/architecture.qmd
            - pages/internals/call_tree.qmd
            
            # - pages/internals/explicit_config_system.qmd

            - pages/internals/MPFR_FINAL_STATUS.md
            
            - pages/internals/caching_architecture.md
            - pages/internals/caching.qmd

            - pages/internals/python_cpp_bridge_jax_integration.md
            - pages/internals/ffi_and_openmp.qmd

            - pages/internals/trace_ipfs.ipynb
            - pages/internals/trace_elimination_retracing.md

            - pages/internals/svgd.ipynb
            - pages/internals/svgd_trace_eval.qmd
            - pages/internals/preconditioning.md
            - pages/internals/svgd_step_sizes.qmd
            - pages/internals/svgd_learning_rate.qmd

            - href: https://github.com/munch-group/phasic/issues
              text: Issue Tracker
        # - galleries/examples/index.qmd

lightbox: true

format:
  html:
    grid:
      sidebar-width: 330px
      body-width: 900px
      margin-width: 270px
      gutter-width: 1.5rem
      # margin-left, margin-right, margin-top, margin-bottom

    # theme: [cosmo, numpy.theme, custom.scss] # numpy.theme for code highlighting

    theme: [cosmo, custom.scss] # numpy.theme for code highlighting
    highlight-style: numpy.theme

    # theme:
    #   light: [flatly, numpy.theme, custom.scss] 
    #   dark: [darkly, numpy.theme, custom.scss] 

    # theme: 
    #   light: [cosmo, numpy.theme]
    #   dark: [darkly, numpy-dark.theme]    
    css:
      - api/_styles-quartodoc.css
      - numpy.css  # for code box styles highlighting styles
      # - styles.css
      # - custom.css
      # - numpy-navbar-sidebar.css
    notebook-links: true
    callout-icon: false
    code-overflow: wrap
    fig-align: center    
    html-math-method: katex
    toc: true
    mermaid:
      theme: neutral     
    linkcolor: "#0D7D92"

quartodoc:
  package: phasic
  # package: null
  # source_dir: ../src/cpp
  style: pkgdown
  dir: api
  dynamic: true  # Use runtime import for compiled extensions
  parser: numpy  # Use numpy docstring parser (more lenient)
  render_interlinks: true
  options:
    signature_name: full
    # include_inherited: false  # Avoid cyclic alias issues with C++ parent class
    # include_empty: false  # Skip items that can't be loaded
  renderer:
    style: markdown
    table_style: description-list
  sidebar: "api/_sidebar.yml"
  css: "api/_styles-quartodoc.css"

  sections:
    - title: Graph Construction
      package: phasic
      desc: |
        Graph components (Vertex and Edge are documented as part of Graph)
      contents:
        - Graph
    # - title: JAX-compatible utils
    #   package: phasic
    #   desc: |
    #     JAX-compatible phase-type distribution computations with FFI integration.
    #     Supports JIT compilation, automatic differentiation, and vmap/pmap parallelization.
    #   contents:
    #     - compute_pmf_ffi
    #     - compute_moments_ffi
    #     - compute_pmf_and_moments_ffi

    - title: Inference
      package: phasic
      desc: |
        Stein Variational Gradient Descent for Bayesian parameter inference.
      contents:
        - SVGD

