project:
  type: website
  output-dir: _build
  pre-render: 
    - quarto render mathref/ 

  # resources:
  # - objects.txt
  # - objects-test.txt

  # pre-render: generate-gallery.ts
  # # Hack to clean temporary file
  # # post-render:
  # #   - find galleries/ -name "gallery-styles.css" -delete

  render:
    - "**/*.qmd"  # render all qmd files
    - "**/*.ipynb"  # render all qmd files
    # - "!draft-*.qmd"  # except those starting with draft-
    - "!internals/"  # exclude entire directories
    - "!pages/benchmarks/**"
    - "!pages/popgen/"
    - "!pages/topics/R/"
    - "!mathref/"  # Mathematical Reference is a separate Quarto book project with its own _quarto.yml
    - "!pages/vignettes/"  

comments:
  hypothesis: true
  
execute:
  freeze: auto
  echo: true
  fig-format: svg  

metadata-files:
  - api/_sidebar.yml

filters:
